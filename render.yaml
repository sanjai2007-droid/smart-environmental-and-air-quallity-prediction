services:
  - type: web
    name: smart-environmental-air-quality-prediction
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements-render.txt
    startCommand: gunicorn --chdir backend app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GEMINI_API_KEY
        sync: false
